<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <title>Focus</title>
  
  <style>

  * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #111318;
      color: white;
      min-height: 100vh;
    }

    .app {
      max-width: 430px;
      margin: 0 auto;
      min-height: 100vh;
      padding-bottom: 60px;
    }

    .nav {
      max-width: 430px;
      position: fixed;
      height: 60px;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      background: rgba(17,19,24,0.92);
      backdrop-filter: blur(20px);
      border-top: 1px solid #2C2E38;
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 10px 0;
    }

    .nav-item {
      width: 70px;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #aaa;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      gap: 4px; 
    }

    .nav-fab {
      width: 50px;
      height: 50px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .nav-fab-circle {
      width: 50px;
      height: 50px;
      background: #23ccff;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 24px;
      box-shadow: 0 4px 20px rgba(35,204,255,0.35);
    }

    .nav-item.active {
      color: #23ccff;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

  </style>
</head>

<body>

  <div class="app">
    <div class="screen active" id="screen-overview">
      <h1>Welcome to Focus</h1>
    </div>
    <div class="screen" id="screen-projects">
      <h2>Projects</h2>
    </div>
    <div class="screen" id="screen-add">
      <h2>Add</h2>
    </div>
    <div class="screen" id="screen-test">
      <h2>Test</h2>
    </div>
    <div class="screen" id="screen-test2">
      <h2>Test2</h2>
    </div>
  </div>

  <nav class ="nav">
  <div class="nav-item active" onclick="switchTab('overview')">
      <span class="nav-item-icon">🏠</span>
      <span class="nav-item-label">Overview</span>
  </div>
  <div class="nav-item" onclick="switchTab('projects')">
      <span class="nav-item-icon">📁</span>
      <span class="nav-item-label">Projects</span>
  </div>
  <div class="nav-fab" onclick="switchTab('add')">
      <div class="nav-fab-circle">+</div>
  </div>
  <div class="nav-item" onclick="switchTab('test')">
      <span class="nav-item-icon">📁</span>
      <span class="nav-item-label">Test</span>
  </div>
  <div class="nav-item" onclick="switchTab('test2')">
      <span class="nav-item-icon">📁</span>
      <span class="nav-item-label">Test2</span>
  </div>
  </nav>

  <script>
    function switchTab(name) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById('screen-' + name).classList.add('active');

      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      event.currentTarget.classList.add('active');
    }
  </script>

</body>
</html>
